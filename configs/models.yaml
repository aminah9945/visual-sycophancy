generators:
  qwen3-30b:
    id: qwen/qwen3-30b-a3b-instruct-2507
    family: Qwen (open weights)
    backend: openrouter
    price_in: 0.10
    price_out: 0.30
  gpt-4o-mini:
    id: openai/gpt-4o-mini
    family: OpenAI
    backend: openrouter
    price_in: 0.15
    price_out: 0.60
